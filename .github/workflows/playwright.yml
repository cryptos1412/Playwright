name: Playwright Tests

on:
  # Jalankan otomatis setiap push ke branch main
  push:
    branches: [ main ]
  
  # Jalankan manual dari GitHub (ini yang akan dipanggil n8n nanti)
  workflow_dispatch:
    inputs:
      command:
        description: 'Perintah dari Telegram'
        required: false
        default: 'run-all'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    - name: Run Playwright tests
      run: npx playwright test
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
    - name: Notify Telegram via n8n
      if: always()
      run: |
        STATUS="${{ job.status }}"
        curl -X POST "https://afifadum.app.n8n.cloud/webhook-test/a31cb2e2-7ca9-47dc-8207-bd085f0f7093/webhook" \
          -H "Content-Type: application/json" \
          -d "{\"status\": \"$STATUS\", \"time\": \"$(date)\"}"