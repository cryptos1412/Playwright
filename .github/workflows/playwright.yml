name: Playwright Tests

on:
  # Jalankan otomatis setiap push ke branch main
  push:
    branches: [ main ]
  
  # Jalankan manual dari GitHub (ini yang akan dipanggil n8n nanti)
  workflow_dispatch:
    inputs:
      command:
        description: 'Perintah dari Telegram'
        required: false
        default: 'all'
      test_path:
        description: 'Path file test'
        required: false
        default: ''

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Prepare screenshot folder
      run: |
        AUTOMATION_NAME="${{ github.event.inputs.test_path }}"
        if [ -z "$AUTOMATION_NAME" ]; then
          AUTOMATION_NAME="all"
        fi
        AUTOMATION_NAME="$(echo "$AUTOMATION_NAME" | sed 's#^tests/##' | sed 's#[^A-Za-z0-9._-]#-#g' | sed 's#\.spec\.js$##')"
        RUN_TIME="$(date +'%Y-%m-%d_%H-%M')"
        SCREENSHOT_DIR="screenshots/${AUTOMATION_NAME}-${RUN_TIME}"
        mkdir -p "$SCREENSHOT_DIR"
        echo "SCREENSHOT_DIR=$SCREENSHOT_DIR" >> "$GITHUB_ENV"
        echo "SCREENSHOT_ZIP=${AUTOMATION_NAME}-${RUN_TIME}-screenshots.zip" >> "$GITHUB_ENV"
    
    - name: Run Playwright tests
      id: playwright
      run: |
        npx playwright test ${{ github.event.inputs.test_path }} --reporter=html 2>&1 | tee playwright-output.txt
        {
          echo "result<<EOF"
          tail -n 20 playwright-output.txt
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
      continue-on-error: true

    - name: Ensure Playwright HTML report exists
      if: always()
      run: |
        if [ ! -f playwright-report/index.html ]; then
          mkdir -p playwright-report
          cat > playwright-report/index.html <<'EOF'
        <!doctype html>
        <html>
          <head>
            <meta charset="utf-8">
            <title>Playwright Report</title>
            <style>
              body { font-family: Arial, sans-serif; padding: 32px; line-height: 1.5; }
              pre { background: #f6f8fa; padding: 16px; overflow: auto; white-space: pre-wrap; }
            </style>
          </head>
          <body>
            <h1>Playwright report was not generated</h1>
            <p>The test command finished before Playwright created the HTML report. Check the output below.</p>
            <pre>
        EOF
          cat playwright-output.txt >> playwright-report/index.html
          cat >> playwright-report/index.html <<'EOF'
            </pre>
          </body>
        </html>
        EOF
        fi

    - name: Create screenshot ZIP
      if: always()
      run: |
        zip -r "$SCREENSHOT_ZIP" screenshots
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

    - name: Upload screenshot ZIP
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-screenshots
        path: ${{ env.SCREENSHOT_ZIP }}
        retention-days: 7

    - name: Notify Telegram via n8n
      if: always()
      run: |
        STATUS="${{ job.status }}"
        RESULT="${{ steps.playwright.outputs.result }}"
        TIME="$(date)"
        RUN_URL="https://github.com/cryptos1412/Playwright/actions/runs/${{ github.run_id }}"
        curl -X POST "https://afifadum.app.n8n.cloud/webhook/notify-telegram" \
        -H "Content-Type: application/json" \
        -d "{\"status\": \"$STATUS\", \"result\": \"$RESULT\", \"time\": \"$TIME\", \"report_url\": \"$RUN_URL\"}"
    - name: Convert report to PDF and send to Telegram
      if: always()
      run: |
        STATUS="${{ job.status }}"
        RESULT="${{ steps.playwright.outputs.result }}"
    
        node -e "
        const { chromium } = require('playwright');
        (async () => {
        const browser = await chromium.launch();
        const page = await browser.newPage();
        await page.goto('file://' + process.cwd() + '/playwright-report/index.html');
        await page.waitForLoadState('networkidle');
        await page.pdf({ path: 'report.pdf', format: 'A4', printBackground: true });
        await browser.close();
        console.log('PDF created');
        })();
        "
    
        curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
          -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -F "document=@report.pdf" \
          -F "caption=Playwright selesai! Status: $STATUS | Hasil: $RESULT"

    - name: Send screenshot ZIP to Telegram
      if: always()
      run: |
        STATUS="${{ job.status }}"
        RESULT="${{ steps.playwright.outputs.result }}"

        curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
          -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -F "document=@${SCREENSHOT_ZIP}" \
          -F "caption=ZIP screenshot otomatis dari folder ${SCREENSHOT_DIR}. Status: $STATUS | Hasil: $RESULT"
