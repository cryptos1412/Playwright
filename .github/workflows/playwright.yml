name: Playwright Tests

on:
  # Jalankan otomatis setiap push ke branch main
  push:
    branches: [ main ]
  
  # Jalankan manual dari GitHub (ini yang akan dipanggil n8n nanti)
  workflow_dispatch:
    inputs:
      command:
        description: 'Perintah dari Telegram'
        required: false
        default: 'all'
      test_path:
        description: 'Path file test'
        required: false
        default: ''

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    - name: Run Playwright tests
      id: playwright
      run: |
        npx playwright test ${{ github.event.inputs.test_path }} --reporter=html 2>&1 | tee playwright-output.txt
        echo "result=$(tail -1 playwright-output.txt)" >> $GITHUB_OUTPUT
      continue-on-error: true
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
    - name: Notify Telegram via n8n
      if: always()
      run: |
        STATUS="${{ job.status }}"
        RESULT="${{ steps.playwright.outputs.result }}"
        TIME="$(date)"
        RUN_URL="https://github.com/cryptos1412/Playwright/actions/runs/${{ github.run_id }}"
        curl -X POST "https://afifadum.app.n8n.cloud/webhook/notify-telegram" \
        -H "Content-Type: application/json" \
        -d "{\"status\": \"$STATUS\", \"result\": \"$RESULT\", \"time\": \"$TIME\", \"report_url\": \"$RUN_URL\"}"
    - name: Convert report to PDF and send to Telegram
      if: always()
      run: |
        STATUS="${{ job.status }}"
        RESULT="${{ steps.playwright.outputs.result }}"
    
        node -e "
        const { chromium } = require('playwright');
        (async () => {
        const browser = await chromium.launch();
        const page = await browser.newPage();
        await page.goto('file://' + process.cwd() + '/playwright-report/index.html');
        await page.waitForLoadState('networkidle');
        await page.pdf({ path: 'report.pdf', format: 'A4', printBackground: true });
        await browser.close();
        console.log('PDF created');
        })();
        "
    
        curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
          -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -F "document=@report.pdf" \
          -F "caption=Playwright selesai! Status: $STATUS | Hasil: $RESULT"