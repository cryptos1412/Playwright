<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <form id="loginForm" class="login-card" novalidate>
      <h1>Sign in</h1>

      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        placeholder="you@example.com"
      />
      <p id="emailError" class="error" role="alert"></p>

      <label for="password">Password</label>
      <div class="password-row">
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Your password"
        />
        <button id="togglePassword" type="button" aria-label="Show password">Show</button>
      </div>
      <p id="passwordError" class="error" role="alert"></p>

      <label class="checkbox-row">
        <input id="remember" name="remember" type="checkbox" />
        <span>Remember me</span>
      </label>

      <button id="submitBtn" type="submit">Sign in</button>

      <p id="formError" class="error form-error" role="alert"></p>
      <p id="formSuccess" class="success" role="status"></p>
    </form>
  </main>

  <script src="login.js"></script>
</body>
</html>
